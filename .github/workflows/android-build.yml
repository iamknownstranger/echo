name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Prepare shared debug keystore
      run: |
        mkdir -p "$HOME/.android"
        if [ ! -f "$HOME/.android/debug.keystore" ]; then
        keytool -genkeypair \
          -keystore "$HOME/.android/debug.keystore" \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -dname "CN=Android Debug,O=Android,C=US" \
          -keyalg RSA \
          -validity 10000
        fi

    - name: Run companion and phone unit tests
      run: |
        chmod +x gradlew
        ./gradlew --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :wear-sync:testDebugUnitTest :app:testUniversalGmsDebugUnitTest

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Echo-Music-Test-Reports
        path: |
          wear-sync/build/test-results/
          wear-sync/build/reports/tests/
          app/build/test-results/
          app/build/reports/tests/
        if-no-files-found: warn

    - name: Decode Keystore
      if: ${{ env.KEYSTORE_BASE64 != '' }}
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

    - name: Build Release APK
      if: ${{ env.KEYSTORE_BASE64 != '' }}
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleUniversalGmsRelease :wear:assembleRelease :wear:lintRelease

    - name: Build Debug APK (fork PR fallback without signing)
      if: ${{ env.KEYSTORE_BASE64 == '' }}
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        chmod +x gradlew
        ./gradlew --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleUniversalGmsDebug :wear:assembleDebug :wear:lintDebug

    - name: Verify matching APK signing certificates
      run: |
        signer="$(rg --files "$ANDROID_HOME/build-tools" -g apksigner | sort -V | tail -n 1)"
        phone_apk="$(rg --files app/build/outputs/apk -g '*.apk')"
        watch_apk="$(rg --files wear/build/outputs/apk -g '*.apk')"
        test -f "$phone_apk"
        test -f "$watch_apk"
        phone_cert="$("$signer" verify --print-certs "$phone_apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
        watch_cert="$("$signer" verify --print-certs "$watch_apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
        test -n "$phone_cert"
        test "$phone_cert" = "$watch_cert"

    - name: Upload Universal APK
      uses: actions/upload-artifact@v4
      with:
        name: Echo-Music-Universal-APK
        path: app/build/outputs/apk/**/*.apk

    - name: Upload Wear OS APK
      uses: actions/upload-artifact@v4
      with:
        name: Echo-Music-Wear-APK
        path: wear/build/outputs/apk/**/*.apk
        if-no-files-found: error
